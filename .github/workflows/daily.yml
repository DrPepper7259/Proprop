name: Daily props

on:
  schedule:
    - cron: "0 17 * * *"   # every day at 17:00 UTC (about 12-1pm Eastern)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python pipeline.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MARKETS: "PTS,REB,AST"
      - name: Save fresh data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json logs_cache_v2.csv
          git commit -m "Update data" || echo "Nothing new"
          git push
